name: TypeScript Format & Test

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    branches: [main, development]

jobs:
  format-and-test:
    name: Run TypeScript Checks
    if: "! github.event.pull_request.draft"
    uses: ./.github/workflows/_pr-checks.yml
